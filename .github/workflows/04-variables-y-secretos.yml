name: 04 - Variables y secretos
on: workflow_dispatch
env:                                   # nivel workflow: todos los jobs la ven
  DB_NAME: riesgo-credito
jobs:
  model-ci:
    runs-on: ubuntu-latest
    env:                               # nivel job: solo este job la ve
      DB_HOST: db.banco-ejemplo.internal
      DB_PORT: 5432
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Dos formas de leer una variable
        run: |
          echo "Shell:     $DB_NAME en $DB_HOST:$DB_PORT"
          echo "Expresión: ${{ env.DB_NAME }} en ${{ env.DB_HOST }}:${{ env.DB_PORT }}"
      - name: Los secretos se enmascaran en el log
        run: echo "Usuario $DB_USER, password $DB_PASSWORD"     # el log muestra ***
      - name: Variables de configuración (no secretas)
        run: echo "Umbral mínimo de AUC = ${{ vars.AUC_MIN }}"

  model-cd:
    needs: model-ci
    runs-on: ubuntu-latest
    environment: produccion            # toma los secrets del environment y respeta sus reglas
    steps:
      - name: ¿Qué ve este job?
        run: |
          echo "DB_NAME = $DB_NAME"    # sí: es de nivel workflow
          echo "DB_HOST = $DB_HOST"    # vacío: era de nivel job en model-ci
      - name: Secretos del environment produccion
        env:                           # nivel step
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "Conectando a producción con password $DB_PASSWORD"
