name: demo-01
on: workflow_dispatch
jobs:
  model-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python run_pipeline.py
      - run: ls outputs/train/models
  model-cd:
    needs: model-ci
    runs-on: ubuntu-latest
    steps:
      - run: ls outputs/train/models
